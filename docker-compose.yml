# FreshMart POS — single container, SQLite on a named volume.
#
#   cp .env.example .env      # set the admin/developer secrets + off-site backup keys
#   docker compose up -d
#
# Open http://localhost:3000 and sign in with the admin password from .env.
services:
  pos:
    build: .
    image: freshmart-pos:2.2
    container_name: freshmart-pos
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Only Secure cookies travel over HTTPS; behind a TLS proxy keep the default.
      POS_COOKIE_SECURE: "${POS_COOKIE_SECURE:-true}"
    ports:
      - "${POS_PORT:-3000}:3000"
    volumes:
      - pos-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    # SQLite is a single-writer database: keep exactly one container per store.
    stop_grace_period: 15s

volumes:
  pos-data:
