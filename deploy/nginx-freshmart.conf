# Reverse proxy with TLS termination. Cookies are Secure by default, so the
# POS must sit behind HTTPS in production.
#
#   sudo cp deploy/nginx-freshmart.conf /etc/nginx/sites-available/freshmart-pos
#   sudo ln -s /etc/nginx/sites-available/freshmart-pos /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Get the certificate with: sudo certbot --nginx -d pos.example.com
server {
    listen 80;
    server_name pos.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name pos.example.com;

    ssl_certificate     /etc/letsencrypt/live/pos.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos.example.com/privkey.pem;

    client_max_body_size 5m;   # stock imports are capped at 3 MB

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
